{% extends "base.html" %}
{% load humanize %}
{% block content %}
<div class="container mt-4">
    
    <!-- Kotak Breadcrumb dengan background abu-abu terang -->
    <div class="card border-0 px-3 py-2 mb-3" style="background-color: #EAECF0;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'expenses' %}">Pengeluaran</a></li>
                <li class="breadcrumb-item active" aria-current="page">Tambah pengeluaran</li>
            </ol>
        </nav>
    </div>

    <!-- Kotak Card Utama untuk Form -->
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form action="{% url 'add_expense' %}" method="post">
                {%include 'partials/_massages.html'%} {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="">Amount</label>
                    <input type="number" class="form-control" name="amount" value="{{ values.amount|floatformat:0|intcomma}}">
                </div>
                
                <div class="form-group mb-3">
                    <label for="">Description</label>
                    <input type="text" class="form-control" name="description" value="{{ values.description }}">
                </div>
                
                <div class="form-group mb-3">
                    <label for="">Category</label>
                    <select class="form-control" name="category">
                        {%for category in categories%} 
                         <option value="{{category.name}}">{{category.name}}</option>
                        {%endfor%}`
                    </select>
                </div>
                
                <div class="form-group mb-3">
                    <label for="">Date of Expense</label>
                    <input type="date" class="form-control" name="date" value="{{ values.date }}">
                </div>

                <button type="submit" class="btn btn-primary btn-sm px-4" style="background-color : #0f172a;">Submit</button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
