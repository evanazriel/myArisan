{% extends "base.html" %}
{% load humanize %}

{% block content %}
<div class="container mt-4">

    <!-- Breadcrumb Pemasukan ditaruh di sini -->
    <div class="card border-0 px-3 py-2 mb-3" style="background-color: #EAECF0;">
      <div class="d-flex justify-content-between align-items-center">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#">Spin wheel</a></li>
            <li class="breadcrumb-item active" aria-current="page">Kocokan Arisan</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Konten Spin Wheel diatur agar teksnya rata tengah -->
    <div class="text-center">
        <h2>Spin Wheel - MyArisan</h2>

        <div class="wheel-container mx-auto position-relative" style="width: 350px; height: 350px; margin-top: 20px;">
            <div class="pointer" style="position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #e74c3c; z-index: 10;"></div>
            <canvas id="wheelCanvas" width="500" height="500" style="width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);"></canvas>
        </div>

        <button id="spinBtn" class="btn btn-primary mt-3 px-4 py-2 font-weight-bold" onclick="spinWheel()">PUTAR SEKARANG</button>
        <div id="result" class="mt-3 font-weight-bold h4"></div>
    </div>

</div>

<script>
    // Menerima data nama dari views.py Django secara aman
    const names = {{ names|safe }};
    const colors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22"];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    
    let startAngle = 0;
    const arc = Math.PI / (names.length / 2);
    let spinning = false;

    function drawWheel() {
        const outsideRadius = 220;
        const textRadius = 140;
        const insideRadius = 0;

        ctx.clearRect(0, 0, 500, 500);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;

        for (let i = 0; i < names.length; i++) {
            const angle = startAngle + i * arc;
            ctx.fillStyle = colors[i % colors.length];

            ctx.beginPath();
            ctx.arc(250, 250, outsideRadius, angle, angle + arc, false);
            ctx.arc(250, 250, insideRadius, angle + arc, angle, true);
            ctx.stroke();
            ctx.fill();

            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.translate(
                250 + Math.cos(angle + arc / 2) * textRadius,
                250 + Math.sin(angle + arc / 2) * textRadius
            );
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            let text = names[i];
            ctx.font = "bold 20px Arial";
            ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
            ctx.restore();
        }
    }

    let currentAngle = 0;
    let spinTimeout = null;
    let spinAngleStart = 0;
    let spinTime = 0;
    let spinTimeTotal = 0;

    function spinWheel() {
        if (spinning) return;
        spinning = true;
        document.getElementById('result').innerText = "";
        document.getElementById('spinBtn').disabled = true;

        spinAngleStart = Math.random() * 20 + 15;
        spinTime = 0;
        spinTimeTotal = Math.random() * 3000 + 4000;
        rotateWheel();
    }

    function rotateWheel() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) {
            stopRotateWheel();
            return;
        }
        let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
        startAngle += (spinAngle * Math.PI / 180);
        drawWheel();
        spinTimeout = setTimeout(rotateWheel, 30);
    }

    function stopRotateWheel() {
        clearTimeout(spinTimeout);
        const degrees = startAngle * 180 / Math.PI + 90;
        const arcd = arc * 180 / Math.PI;
        const index = Math.floor((360 - (degrees % 360)) / arcd);
        
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('result').innerText = "Pemenang: " + names[index];
    }

    function easeOut(t, b, c, d) {
        let ts = (t /= d) * t;
        let tc = ts * t;
        return b + c * (tc + -3 * ts + 3 * t);
    }

    drawWheel();
</script>
{% endblock %}
