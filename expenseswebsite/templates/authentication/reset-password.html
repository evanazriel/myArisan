{% extends "base_auth.html" %}
{% load static %}
{% block content %}
<div class="auth-card">
  <!-- Title Minimalis -->
  <h3 class="fw-bold mb-1 text-white">Reset password</h3>
  <p class="text-secondary small mb-4 auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

  <!-- Blok Alert Parsial -->
  {% include 'partials/_massages.html' %}

  <form action="" method="post">
    {% csrf_token %}
    
    <!-- Input Email -->
    <div class="mb-3">
      <input 
        type="email" 
        name="email" 
        class="form-control form-control-minimal" 
        placeholder="Enter your email address"
        required
      />
    </div>

    <!-- Button Submit -->
    <div class="mt-4">
      <button type="submit" class="btn btn-minimal w-100">Send Reset Link</button>
    </div>

    <!-- Link kembali ke Login -->
    <div class="mt-4 text-center">
      <span class="text-secondary small">Remember your password? </span>
      <a href="{% url 'login' %}" class="show-toggle fw-semibold">Login</a>
    </div>

  </form>
</div>
{% endblock %}
